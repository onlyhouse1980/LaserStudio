name: Build macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish LaserStudio DMG
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build app and installer
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./script/package_macos.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/LaserStudio-macOS.dmg
          --title "LaserStudio $GITHUB_REF_NAME"
          --generate-notes
